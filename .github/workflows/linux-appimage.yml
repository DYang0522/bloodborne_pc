# Linux AppImage workflow, following the build stages used by the gow3 project.
# Keep Bloodborne's own Nix environment, build script and AppImage bundler:
# the two projects have different dependencies and packaging implementations.
name: Linux AppImage

on:
  push:
    branches: [linux-r9-290x]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: linux-appimage-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Dependencies
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Update nixpkgs channel
        run: |
          nix-channel --add https://nixos.org/channels/nixpkgs-unstable nixpkgs
          nix-channel --update

      - name: Hardware-check tests
        run: PYTHONPATH=tests:scripts python3 tests/test_launcher_hardware.py

      - name: Build and native tests
        run: |
          # The runtime tests create this directory and currently do not create its parent.
          mkdir -p "$HOME/.local/share/shadPS4"
          bash build.sh --test

      - name: AppImage
        run: nix-shell shell.nix --run "bash packaging/appimage.sh"

      - uses: actions/upload-artifact@v4
        with:
          name: Bloodborne-bbport-x86_64.AppImage
          path: dist/Bloodborne-bbport-x86_64.AppImage
          if-no-files-found: error
