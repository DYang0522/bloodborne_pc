# Linux AppImage workflow, following the build stages used by the gow3 project.
# Keep Bloodborne's own Nix environment, build script and AppImage bundler:
# the two projects have different dependencies and packaging implementations.
name: Linux AppImage

on:
  push:
    branches: [linux-r9-290x]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: linux-appimage-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Dependencies
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Update nixpkgs channel
        run: |
          nix-channel --add https://nixos.org/channels/nixpkgs-unstable nixpkgs
          nix-channel --update

      - name: Hardware-check tests
        run: PYTHONPATH=tests:scripts python3 tests/test_launcher_hardware.py

      - name: Build and native tests
        run: |
          # The runtime tests create this directory and currently do not create its parent.
          mkdir -p "$HOME/.local/share/shadPS4"
          bash build.sh --test

      - name: AppImage
        run: nix-shell shell.nix --run "bash packaging/appimage.sh"

      - name: Smoke-test the packaged launcher
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb fonts-dejavu-core
          # nix-appimage relies on unprivileged user namespaces to mount its Nix store.
          unshare -Ur true
          chmod +x dist/Bloodborne-bbport-x86_64.AppImage
          set +e
          xvfb-run -a timeout --signal=TERM --kill-after=5s 20s \
            ./dist/Bloodborne-bbport-x86_64.AppImage \
            > "$RUNNER_TEMP/bbport-appimage-smoke.log" 2>&1
          status=$?
          set -e
          cat "$RUNNER_TEMP/bbport-appimage-smoke.log"
          if [ "$status" -ne 124 ]; then
            echo "AppImage launcher exited instead of staying open (status $status)." >&2
            exit 1
          fi
          echo "AppImage launcher stayed open for 20 seconds."

      - uses: actions/upload-artifact@v4
        with:
          name: Bloodborne-bbport-x86_64.AppImage
          path: dist/Bloodborne-bbport-x86_64.AppImage
          if-no-files-found: error
