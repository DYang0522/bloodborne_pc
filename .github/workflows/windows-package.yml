name: Windows package

on:
  workflow_dispatch:
  push:
    branches: [windows]
    paths:
      - 'gpu/**'
      - 'src/**'
      - 'scripts/**'
      - 'launcher/**'
      - 'packaging/windows/**'
      - 'build.sh'
      - 'msys2-env.sh'
      - '.github/workflows/windows-package.yml'

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-latest
    steps:
      - name: Checkout source and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Windows Python for the frozen launcher
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: Export Windows Python path
        shell: pwsh
        run: |
          $python = (Get-Command python).Source -replace '\\', '/'
          "WINPYTHON=$python" >> $env:GITHUB_ENV

      - name: Set up MSYS2 CLANG64
        uses: msys2/setup-msys2@v2
        with:
          msystem: CLANG64
          update: true
          install: >-
            git
            patch
            mingw-w64-clang-x86_64-toolchain
            mingw-w64-clang-x86_64-cmake
            mingw-w64-clang-x86_64-ninja
            mingw-w64-clang-x86_64-pkgconf
            mingw-w64-clang-x86_64-python
            mingw-w64-clang-x86_64-vulkan-headers
            mingw-w64-clang-x86_64-vulkan-loader
            mingw-w64-clang-x86_64-vulkan-memory-allocator
            mingw-w64-clang-x86_64-glslang
            mingw-w64-clang-x86_64-sdl3
            mingw-w64-clang-x86_64-fmt
            mingw-w64-clang-x86_64-boost
            mingw-w64-clang-x86_64-robin-map
            mingw-w64-clang-x86_64-xxhash
            mingw-w64-clang-x86_64-ffmpeg
            mingw-w64-clang-x86_64-zydis
            mingw-w64-clang-x86_64-spirv-tools
            mingw-w64-clang-x86_64-spirv-headers
            mingw-w64-clang-x86_64-spirv-cross
            mingw-w64-clang-x86_64-protobuf
            mingw-w64-clang-x86_64-openssl
            mingw-w64-clang-x86_64-zlib
            mingw-w64-clang-x86_64-miniupnpc
            mingw-w64-clang-x86_64-nlohmann-json

      - name: Build Bloodborne Windows binaries
        shell: msys2 {0}
        run: |
          set -euxo pipefail
          echo "WINPYTHON=$WINPYTHON"
          "$WINPYTHON" --version
          git submodule status
          bash build.sh 2>&1 | tee build-windows.log

      - name: Package ready-to-run Windows ZIP
        shell: msys2 {0}
        run: |
          set -euxo pipefail
          bash packaging/windows/package.sh --zip-only 2>&1 | tee package-windows.log

      - name: Upload Windows package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bloodborne-windows-package
          path: |
            dist/bbport-windows.zip
            dist/fsr4vk-v0.4.3-amdfix-src.zip
            build-windows.log
            package-windows.log
          if-no-files-found: warn
          retention-days: 14
